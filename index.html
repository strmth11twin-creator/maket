<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/Images/favicon(2).png">
    <link rel="stylesheet" href="dist/index.css">
    <title>Life Streaming</title>
</head>

<body>
    <header class="header__section">
        <div class="container">
            <div class="header">
                <div class="header__cloud">
                    <h2 class="header__cloud-title">CLOUD FLEX</h2>
                </div>
                <nav class="header__links">
                    <ul class="header__links-list">
                        <li class="header__links-item">
                            <a href="" class="header__links-link">About</a>
                        </li>
                        <li class="header__links-item">
                            <a href="" class="header__links-link">Contacts</a>
                        </li>
                    </ul>
                </nav>
                <div class="header__covid">
                    <h2 class="header__covid-title">COVID-19 UPDATE</h2>
                    <svg class="header__covid-icon">
                        <use href="assets/spryties.svg#globe-icon"></use>
                    </svg>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero__section">
            <div class="container">
                <div class="hero">
                    <div class="hero__content">
                        <h1 class="hero__content-title">WHEN PERFORMANCE MATTERS</h1>
                        <button class="hero__content-button">Start development with us!</button>
                    </div>
                    <div class="hero__table">
                        <p class="hero__table-text">WE USE COOKIES TO ENSURE YOUR BEST EXPERIENCE.
                            THROUGH YOUR CONTINUED USE OF THIS SITE YOU ACCEPT THIS USE.
                            FOR MORE INFORMATION, PLEASE SEE OUR PRIVACY POLICY.</p>
                        <button class="hero__table-button">ACCEPT</button>
                        <img src="assets/Images/image 8.png" alt="" class="hero__table-img">
                    </div>
                    <div class="hero__scroll">
                        <span class="hero__scroll-content">Scroll down</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="work__section">
            <div class="container">
                <div class="work">
                    <h2 class="work__title">How we work</h2>
                    <div class="work__cards">
                        <figure class="work__cards-card anlysis">
                            <svg class="card__icon">
                                <use href="assets/spryties.svg#lamp-icon"></use>
                            </svg>
                            <h3 class="card__title">Analysis</h3>
                            <p class="card__description">Gathering client's ideas we are happy to help with a technical
                                vision.</p>
                        </figure>
                        <figure class="work__cards-card design">
                            <svg class="card__icon">
                                <use href="assets/spryties.svg#design-icon"></use>
                            </svg>
                            <h3 class="card__title">Design</h3>
                            <p class="card__description">In-depth analysis makes our solutions flexible, scalable and
                                robust.</p>
                        </figure>
                        <figure class="work__cards-card development">
                            <svg class="card__icon">
                                <use href="assets/spryties.svg#development-icon"></use>
                            </svg>
                            <h3 class="card__title">Development</h3>
                            <p class="card__description">Using best practices to make reliable, well-documented and easy
                                to maintain system.</p>
                        </figure>
                        <figure class="work__cards-card maintenance">
                            <svg class="card__icon">
                                <use href="assets/spryties.svg#screwdriver-icon"></use>
                            </svg>
                            <h3 class="card__title">Maintenance</h3>
                            <p class="card__description">Gathering client's ideas we are happy to help with a technical
                                vision.</p>
                        </figure>
                        <figure class="work__cards-card testing">
                            <svg class="card__icon">
                                <use href="assets/spryties.svg#testing-icon"></use>
                            </svg>
                            <h3 class="card__title">Testing</h3>
                            <p class="card__description">Providing best quality
                                of things developed by us for customers</p>
                        </figure>
                        <figure class="work__cards-card integration">
                            <svg class="card__icon">
                                <use href="assets/spryties.svg#integration-icon"></use>
                            </svg>
                            <h3 class="card__title">Integration</h3>
                            <p class="card__description">Solutions that go with
                                the times to improve businesses and give customers best experience</p>
                        </figure>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
